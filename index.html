<body>
  <header class="app-header">
    <h1>Project Management Application</h1>
  </header>

  <main class="app-layout">
    <aside id="project-list"></aside>
    <section class="project-form">
  <h2>Create Project</h2>

  <form id="project-form">
    <input
      type="text"
      id="project-name"
      placeholder="Project Name"
      required
    />

    <input
      type="text"
      id="project-category"
      placeholder="Category"
    />

    <textarea
      id="project-description"
      placeholder="Description"
    ></textarea>

    <button type="submit">
      Create Project
    </button>
  </form>
</section>

    <section class="content">
      <div id="project-details"></div>
<form id="task-form">

    <input
        id="task-title"
        placeholder="Task Title"
        required>

    <textarea
        id="task-description"
        placeholder="Description">
    </textarea>

    <select id="task-priority">

        <option value="low">
            Low
        </option>

        <option value="medium">
            Medium
        </option>

        <option value="high">
            High
        </option>

    </select>

    <select id="task-status">

        <option value="todo">
            Todo
        </option>

        <option value="in-progress">
            In Progress
        </option>

        <option value="done">
            Done
        </option>

    </select>

    <button>
        Create Task
    </button>

</form>
      <div id="task-list"></div>
    </section>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
